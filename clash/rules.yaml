# 规则追加（AI 流量固定出口 + WebRTC 防泄漏）。站点自有规则（私有网段 / 校园网）请自行在其下追加。
prepend:
  # 2026-10-24：屏蔽 WebRTC / STUN，防止真实公网 IP 经 Chromium 系客户端
  # （Claude Desktop、浏览器等）泄漏：WebRTC 会向 STUN 服务器发 UDP 探测，
  # 而国内 STUN 服务器命中的是 GEOIP,CN → DIRECT，包从真实网卡直接出去。
  # 实测：只封 19302 不够，8 台测试服务器里 7 台走 3478。
  # 若视频通话异常：先删 5349，再删 3478；19302 建议保留。
  - 'AND,((NETWORK,UDP),(DST-PORT,19302)),REJECT'
  - 'AND,((NETWORK,UDP),(DST-PORT,3478)),REJECT'
  - 'AND,((NETWORK,UDP),(DST-PORT,5349)),REJECT'
  - 'DOMAIN-SUFFIX,anthropic.com,🤖 AI 出口'
  - 'DOMAIN-SUFFIX,claude.ai,🤖 AI 出口'
  - 'DOMAIN-SUFFIX,claudeusercontent.com,🤖 AI 出口'
  # Anthropic 遥测/日志域名：不跟 AI 出口一致会从别的节点漏出去（Datadog / Claude Code 上报）
  - 'DOMAIN-SUFFIX,datadoghq.com,🤖 AI 出口'
  - 'DOMAIN-SUFFIX,claicode.com,🤖 AI 出口'
  # Claude 常用的第三方遥测服务商，全部跟随 AI 出口，避免从别的节点露出
  - 'DOMAIN-SUFFIX,sentry.io,🤖 AI 出口'
  - 'DOMAIN-SUFFIX,statsig.com,🤖 AI 出口'
  - 'DOMAIN-SUFFIX,statsigapi.net,🤖 AI 出口'
  - 'DOMAIN-SUFFIX,featuregates.org,🤖 AI 出口'
  - 'DOMAIN-SUFFIX,featureassets.org,🤖 AI 出口'
  - 'DOMAIN-SUFFIX,prodregistryv2.org,🤖 AI 出口'
  - 'DOMAIN-SUFFIX,segment.io,🤖 AI 出口'
  - 'DOMAIN-SUFFIX,segment.com,🤖 AI 出口'
  # 2026-11-18 补全（来自社区清单）：以下域名同样属于 Claude 的完整链路
  - 'DOMAIN-SUFFIX,claude.com,🤖 AI 出口'
  - 'DOMAIN-SUFFIX,claude.app,🤖 AI 出口'
  - 'DOMAIN-SUFFIX,claudemcpcontent.com,🤖 AI 出口'
  - 'DOMAIN-SUFFIX,clau.de,🤖 AI 出口'
  - 'DOMAIN,api-iam.intercom.io,🤖 AI 出口'          # 应用内客服组件
  - 'DOMAIN,nexus-websocket-a.intercom.io,🤖 AI 出口'
  - 'DOMAIN,r.stripe.com,🤖 AI 出口'                 # 支付风控脚本
  - 'DOMAIN,fcmtoken.googleapis.com,🤖 AI 出口'       # 推送 token 注册
  - 'DOMAIN-SUFFIX,siftscience.com,🤖 AI 出口'        # 反欺诈评分
  - 'DOMAIN-SUFFIX,openai.com,🤖 AI 出口'
  - 'DOMAIN-SUFFIX,chatgpt.com,🤖 AI 出口'
  - 'DOMAIN-SUFFIX,oaistatic.com,🤖 AI 出口'
  - 'DOMAIN-SUFFIX,accounts.google.com,🤖 AI 出口'
  - 'DOMAIN-SUFFIX,myaccount.google.com,🤖 AI 出口'
  - 'DOMAIN-SUFFIX,accounts.youtube.com,🤖 AI 出口'
  - 'DOMAIN,www.google.com,🤖 AI 出口'   # 谷歌搜索固定美国静态 IP，避免跳 google.com.hk
  - 'DOMAIN,google.com,🤖 AI 出口'
  - 'DOMAIN-SUFFIX,google.com.hk,🤖 AI 出口'
  # Gemini 也固定美国静态 IP，和 Claude/ChatGPT 保持一致的出口身份
  - 'DOMAIN-SUFFIX,gemini.google.com,🤖 AI 出口'
  - 'DOMAIN-SUFFIX,generativelanguage.googleapis.com,🤖 AI 出口'
  - 'DOMAIN-SUFFIX,makersuite.google.com,🤖 AI 出口'
  - 'DOMAIN-SUFFIX,aistudio.google.com,🤖 AI 出口'
  # Steam 单独走日本节点组（美区节点买国区游戏易被风控）
  - 'DOMAIN-SUFFIX,steampowered.com,🎮 Steam'
  - 'DOMAIN-SUFFIX,steamstatic.com,🎮 Steam'
  - 'DOMAIN-SUFFIX,steamcontent.com,🎮 Steam'
  - 'DOMAIN,steamcdn-a.akamaihd.net,🎮 Steam'
  - 'DOMAIN-SUFFIX,steamcommunity.com,🎮 Steam'
  - 'DOMAIN,checkout.steampowered.com,DIRECT'     # 结算页走直连：Steam 会拒绝 VPN 出口的付款
  - 'DOMAIN-SUFFIX,steampowered.com,白嫖机场'     # 商店本身国内不可直连，仍走代理
  - 'DOMAIN-SUFFIX,steamstatic.com,DIRECT'        # 静态资源国内可达，直连更快
  - 'DOMAIN-SUFFIX,steamcontent.com,DIRECT'
  - 'DOMAIN,steamcdn-a.akamaihd.net,DIRECT'
  # 例：私有网段 / 校园网直连规则（按需替换成你自己的）
  # - 'IP-CIDR,192.168.0.0/16,DIRECT'
  # - 'DOMAIN-SUFFIX,example.edu,DIRECT'
append: []
delete: []
